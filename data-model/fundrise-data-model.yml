root_entities:
- Client
- Offering

traversal_notes:
- >-
  Offering is the only entity resolvable with Partner credentials alone (GetOfferings).
  Everything else requires a Client bearer token.
- >-
  accountId is the hinge of the whole model and is reachable only through CreateClient or
  GetClient — there is no account lookup or list operation.
- >-
  Document and Acknowledgment must both be traversed from Offering before an Investment
  can be created; this is a regulatory ordering constraint encoded in the schema, since
  acknowledgedDocumentIds is required on InvestmentPlacementRequest.

