notes: >-
  Entity-relationship graph derived from the 37 component schemas of the Fundrise Connect
  OpenAPI 3.1.0 — $ref links between schemas and id-reference fields (clientId, accountId,
  offeringId, transactionId, documentId, acknowledgmentId). Fundrise publishes no
  id-prefix convention; all identifiers are opaque strings typed by the shared
  `Identifier` schema.

identifier_convention:
  shared_schema: Identifier
  type: string
  prefixes: none-published
  note: >-
    Every entity id resolves to the same opaque `Identifier` string schema. There is no
    Stripe-style typed prefix, so an id is not self-describing and must be tracked
    alongside its entity type by the integrator.

entities:
- name: Partner
  description: >-
    The company integrating Fundrise Connect. Not a fetchable resource — it is the
    authentication subject behind PartnerBasicAuthentication and the owner of the
    partnerReferenceId namespace.
  schema: null
  id_field: null
  addressable: false

- name: Client
  description: >-
    An end user the Partner onboards onto Fundrise. Created by the Partner, then acts on
    its own behalf via a Client-scoped bearer token.
  schemas:
  - ClientCreationRequest
  - ClientCreationResponse
  - ClientResponse
  - ClientUpdateRequest
  - ClientUpdateResponse
  id_field: clientId
  operations:
  - CreateClient
  - GetClient
  - UpdateClient
  key_fields:
  - partnerReferenceId
  - primaryEmail
  - firstName
  - lastName
  - taxId
  - primaryAddress
  - dateOfBirth
  pii: true

- name: Account
  description: >-
    The investing account belonging to a Client. Every operation that touches money or
    holdings is scoped to an accountId.
  schema: AccountIdResponse
  id_field: accountId
  addressable_directly: false
  note: >-
    There is no GET /account operation — accountId is only obtainable from the accounts[]
    array on ClientCreationResponse or ClientResponse. Fundrise states a newly created
    Client has exactly one account and that multiple accounts are on the long-term
    roadmap.

- name: Offering
  description: >-
    A Fundrise fund available for investment, with status OPEN or CLOSED, an asset class,
    per-transaction investment minimum and maximum, current price and distribution rate.
  schema: OfferingResponse
  id_field: offeringId
  operations:
  - GetOfferings
  - GetHistoricalNav
  - GetOfferingDocuments
  - GetInvestmentAcknowledgments
  enums:
    status: [OPEN, CLOSED]
    assetClass: [REAL_ESTATE, PRIVATE_CREDIT, VENTURE]

- name: OfferingNav
  description: A single dated net asset value per share for an Offering.
  schema: OfferingNavResponse
  id_field: null
  key_fields:
  - effectiveDate
  - netAssetValuePerShare

- name: Document
  description: >-
    An offering document or disclosure a Client must be shown before investing.
  schema: DocumentResponse
  id_field: documentId
  enums:
    documentType: [AGREEMENT, ACKNOWLEDGMENT, DISCLOSURE, PROSPECTUS, OFFERING_CIRCULAR, OTHER, STATEMENT, TAX_FORM]

- name: Acknowledgment
  description: >-
    Text a Client must digitally accept before an investment or liquidation is permitted.
  schemas:
  - Acknowledgment
  - AcknowledgmentResponse
  id_field: acknowledgmentId
  operations:
  - GetInvestmentAcknowledgments
  - GetLiquidationAcknowledgments

- name: Investment
  description: >-
    A placement of dollars into an Offering on behalf of a Client. Surfaces as a
    Transaction of type INVESTMENT once placed.
  schema: InvestmentPlacementRequest
  id_field: transactionId
  operations:
  - PlaceInvestment
  - CancelInvestment
  idempotency_key: partnerReferenceId

- name: Liquidation
  description: >-
    A request to sell shares back for dollars. May span multiple Offerings in one request.
  schemas:
  - ShareLiquidationRequest
  - ShareLiquidationOfferingRequest
  id_field: shareLiquidationRequestId
  operations:
  - CreateShareLiquidationRequest
  - CancelShareLiquidationRequest

- name: Holding
  description: >-
    A Client's position in one Offering — shares, cost basis, current/pending/settled
    value, unpaid distributions, and whether it is liquidable. Updates daily.
  schema: HoldingResponse
  id_field: null
  operations:
  - GetHoldings

- name: Transaction
  description: >-
    A money movement on an account — INVESTMENT, LIQUIDATION or DIVIDEND — with a status
    lifecycle and a per-offering breakdown.
  schemas:
  - TransactionResponse
  - TransactionOfferingResponse
  id_field: transactionId
  operations:
  - GetTransactions
  - GetTransaction
  enums:
    transactionType: [INVESTMENT, LIQUIDATION, DIVIDEND]
    status: [PENDING, COMPLETE, FAILED]
    debitCreditMemo: [DEBIT, CREDIT]

- name: TaxDocument
  description: A tax form issued for an account for a given tax year.
  schema: TaxDocumentResponse
  id_field: documentId
  operations:
  - GetTaxForms

- name: Address
  description: Postal address value object embedded on a Client.
  schemas:
  - Address
  - AddressRequest
  - AddressResponse
  id_field: null
  embedded: true

