- aid: fundrise:fundrise-authentication-api
  name: Fundrise Authentication API
  description: "### Getting access \nTo get started, please contact the support team via <a href=\"mailto:connect@fundrise.com\"\
    \ target=\"_blank\">connect@fundrise.com</a>.\n### Terminology\n  - <strong>Client</strong>: This\
    \ refers to an End-User or customer that a Partner onboards onto Fundrise for investing in Fundrise\
    \ assets.\n  - <strong>Partner</strong>: This refers to a company working with Fundrise to provide\
    \ their End-Users or customers access to Fundrise assets.\n\n### Access issues\nTo ensure a safe,\
    \ secure platform, Fundrise imposes strict access controls to all APIs. As such, there may be services\
    \ or capabilities documented that are inaccessible with current permissions.  Contact the support\
    \ team via <a href=\"mailto:connect@fundrise.com\" target=\"_blank\">connect@fundrise.com</a> to gain\
    \ permissions for additional endpoints or to receive customized support for specific issues or concerns.\n\
    ### Security Models\nFundrise's API supports two different HTTP security schemes:\n- PartnerBasicAuthentication\n\
    - ClientBearerAuthentication\n\nThe appropriate security scheme per endpoint is identified in the\
    \ documentation. \nPartnerBasicAuthentication and ClientBearerAuthentication use values that should\
    \ be treated as sensitive data. Fundrise requires  encrypted storage of these values with necessary\
    \ controls to limit access. All information returned must be treated in full compliance to the end-user\
    \ agreements.\n\n#### PartnerBasicAuthentication \nAccess an endpoint using Partner credentials in\
    \ HTTP Header. \n\n  PartnerBasicAuthentication is enforced by HTTP Basic Authentication. A Partner\
    \ username and password will be provided by Fundrise support. \n  The Partner password should be stored\
    \ securely. At a minimum, it should be encrypted at-rest and access restricted to services making\
    \ requests to the Fundrise API.\n  The Partner password should not be exposed to a Client or any of\
    \ their devices. If the password is compromised please contact Fundrise support.\n\n\n#### ClientBearerAuthentication\
    \ \nAccess an endpoint using an OAuth access token associated with a specific Client. \n\n  ClientBearerAuthentication\
    \ is enforced by HTTP Bearer Authentication and requires an OAuth access token. \n  Since access tokens\
    \ are scoped to specific Clients, they identify and authenticate the Client in a request.\n\n\n  Access\
    \ tokens can be obtained in <a href=\"#tag/Authentication/operation/GetAccessToken\">Get Access Token</a>\
    \ requests by using the refresh token flow.\n  OAuth refresh token are issued on <a href=\"#tag/Clients/operation/CreateClient\"\
    >Client Creation</a> and scoped specifically to that Client.\n  The refresh tokens will not expire\
    \ and should be stored securely after Client creation. At a minimum, refresh tokens should be encrypted\
    \ at-rest and access restricted to services making requests to the Fundrise API.\n  Refresh tokens\
    \ should not be exposed to a Client or any of their devices."
  humanURL: https://fundrise.com/connect-api
  baseURL: https://sandbox.fundrise.com
