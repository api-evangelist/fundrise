  name: Fundrise Clients API
  description: >-
    The Clients API provides operations for creating new Clients and updating fields for existing Clients.

    The Client represents an End-User of the platform. Newly created Clients will have exactly one account
    with a single `accountId`. This `accountId` is used in the Place Investment step of this flow. Currently
    multiple accounts are not supported in the system, but is on our long term roadmap to build.
