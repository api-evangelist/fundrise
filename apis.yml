apis:
- aid: fundrise:fundrise-connect
  name: Fundrise Connect API
  description: 'Fundrise Connect is Fundrise''s external partner API for Client onboarding
    and investment into its alternative-asset offerings. It is organized around REST
    with resource-oriented URLs, JSON responses and conventional HTTP status codes.
    Partners authenticate with HTTP Basic credentials issued by Fundrise; per-Client
    operations use an OAuth bearer access token obtained from a non-expiring refresh
    token issued at Client creation. The surface covers Clients, Offerings (including
    historical daily NAV and offering documents), Acknowledgments, Investments, Liquidations,
    Holdings, Transactions and Tax Forms.'
