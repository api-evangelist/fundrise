aid: fundrise
name: Fundrise
description: 'Fundrise is a Washington, DC based financial technology company that gives
  individual investors direct access to private-market alternative assets — private
  real estate, private credit, and venture capital — through a family of non-traded
  funds it sponsors and manages. Founded in 2012 and an early user of the SEC''s Regulation
  A+ exemption, Fundrise packages institutional-grade private investments into low-minimum
  vehicles bought and held entirely online. Its developer-facing surface is Fundrise
  Connect, a REST API that lets banks, brokerages, investment apps and other financial
  platforms natively onboard their own end users (\"Clients\") into Fundrise offerings:
  create and update Clients, retrieve open Offerings and their historical daily NAV,
  fetch the offering documents and acknowledgments a Client must sign, place and cancel
  investments, request and cancel share liquidations, and read back holdings, transactions
  and tax forms. Access is gated — partners request credentials from the Fundrise Connect
  team — and the API is documented publicly with an OpenAPI 3.1 definition.'
