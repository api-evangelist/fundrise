- aid: fundrise:fundrise-offerings-api
  name: Fundrise Offerings API
  description: "The Offerings API contains information about all Offerings available via Fundrise Connect\
    \ and documents associated with those offerings. Each Offering has a status indicating whether or\
    \ not they are available for investment. An `OPEN` status means the  Offering is ready for investment,\
    \ while the `CLOSED` status indicates it is unavailable. \nThe response also contains the investment\
    \ minimums and maximums for the specific fund. Currently open funds have <strong>$10</strong> minimums\
    \ and <strong>$100,000</strong> maximums. Both minimum and maximum are enforced per Transaction.\n\
    The Offering ID is the foreign key referenced in the <a href=\"#tag/Investments/operation/PlaceInvestment\"\
    >Place Investment</a> operation to indicate which Offering the user is investing in."
  humanURL: https://fundrise.com/connect-api
  baseURL: https://sandbox.fundrise.com
