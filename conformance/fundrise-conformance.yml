regulatory_context:
  note: >-
    Fundrise operates as an SEC-regulated sponsor of Regulation A+ offerings, and the
    contract encodes that regime — Clients must be presented with offering documents and
    acknowledgments and must digitally accept them before an investment or liquidation
    can be placed (acknowledgedDocumentIds is required on InvestmentPlacementRequest;
    allAcknowledgmentsAccepted is required on ShareLiquidationRequest). Tax reporting is
    exposed through GetTaxForms. This is regulatory posture visible in the API surface.
  published_certifications: none-found
  certification_probe: >-
    No trust center, SOC 2, ISO 27001, PCI DSS or comparable certification page was found
    on any Fundrise host. trust.fundrise.com did not resolve; fundrise.com/trust,
    /compliance and /security returned 404 under rendered fetch. Because no compliance
    program is published, no `Compliance` pointer is emitted in apis.yml.

