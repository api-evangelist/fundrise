standards:
- id: openapi-3.1
  conforms: true
  evidence: >-
    Published OpenAPI 3.1.0 document with 15 paths, 17 operations, 37 component schemas,
    tags on every operation, unique operationIds, and 2xx plus 4xx/5xx responses declared
    throughout. Distributed inside the Redocly documentation bundle at connect.fundrise.com.

- id: rest
  conforms: true
  evidence: >-
    Self-declared and structurally consistent — resource-oriented URLs, JSON responses,
    conventional HTTP verbs and status codes.

- id: http-basic-auth
  conforms: true
  evidence: securityScheme PartnerBasicAuthentication, type http, scheme basic (RFC 7617).

- id: http-bearer-auth
  conforms: true
  evidence: securityScheme ClientBearerAuthentication, type http, scheme bearer (RFC 6750).

- id: oauth2
  conforms: partial
  evidence: >-
    Two distinct OAuth surfaces exist. (1) The consumer authorization server at
    fundrise.com publishes authorization_endpoint and token_endpoint and supports the
    authorization_code and refresh_token grants. (2) The Connect partner API implements a
    refresh_token grant at POST /v1/oauth/token returning an OAuth2AccessTokenResponse
    with accessToken, refreshToken, scope, tokenType and expiresIn. Marked partial
    because the OpenAPI models this as an http bearer scheme rather than an oauth2
    securityScheme with declared flows, so generated clients get no flow metadata.

- id: oidc
  conforms: partial
  evidence: >-
    https://fundrise.com/.well-known/openid-configuration returns 200 with
    scopes_supported [openid, offline_access], response_types_supported [code], and
    token_endpoint_auth_methods [client_secret_basic]. Marked partial because the
    document omits fields OpenID Connect Discovery 1.0 requires — issuer, jwks_uri,
    subject_types_supported, id_token_signing_alg_values_supported — so it is a
    partial discovery document rather than a conformant one.

