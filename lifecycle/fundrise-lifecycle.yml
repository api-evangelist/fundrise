versioning:
  scheme: uri-path
  current: v1
  spec_version: 1.0.0
  docs: https://connect.fundrise.com/
  documented_statement: >-
    "API endpoints are versioned with path versioning. Each endpoint contains a version
    path parameter e.g. (/v1/...). To release new functionality without impacting
    existing customers, we will version endpoints and increment version numbers
    accordingly."
  granularity: per-endpoint
  note: >-
    Versions are incremented per endpoint rather than across the whole API, so a Partner
    can in principle be on /v1 for one resource and /v2 for another. All 17 currently
    published operations are on v1.

deprecation:
  policy_published: true
  policy_url: https://connect.fundrise.com/
  documented_statement: >-
    "When endpoints are staged to be deprecated, Partners will be given ample time to
    integrate with new versions according to our service agreement. Partners should
    expect to receive communications related to deprecation timelines."
  notification_channel: direct partner communication
  notice_period: governed by the partner service agreement; no public duration
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    The deprecation commitment is contractual and communicated out of band rather than
    signalled in-protocol. Neither the RFC 8594 Sunset header nor the Deprecation header
    is documented, and no operation in the OpenAPI carries deprecated: true — so an
    automated client has no machine-readable warning of an endpoint's retirement.

deprecated_operations: []

maturity:
  stage: prototype
  documented_statement: >-
    "This API represents a prototype of Fundrise Connect, which is our external API for
    providing Client onboarding and investment into our alternative assets."
  additional_statement: >-
    The Workflow Example tag notes the onboarding flow "is subject to modification
    pending future refinements to this spec."
  roadmap_items_stated_in_docs:
  - >-
    Multiple accounts per Client — "Currently multiple accounts are not supported in the
    system, but is on our long term roadmap to build." Newly created Clients have exactly
    one account.

