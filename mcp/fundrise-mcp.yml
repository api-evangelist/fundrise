agent_suitability:
  note: >-
    This API is a poor fit for unsupervised agent execution and any MCP server built from
    it should reflect that. Placing an investment or a liquidation moves real money into
    or out of a private-market security, and the contract requires the end user to have
    been shown and to have digitally accepted the offering's disclosures first
    (acknowledgedDocumentIds / allAcknowledgmentsAccepted). The read side — offerings,
    NAV history, holdings, transactions, tax forms — is genuinely useful to an agent and
    carries no such hazard. See agentic-access/fundrise-agentic-access.yml.

