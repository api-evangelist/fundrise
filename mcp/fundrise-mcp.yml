write_tools_not_recommended_without_human_approval:
- name: fundrise_create_client
  source_operation: openapi/fundrise-connect-openapi.yml#CreateClient
  reason: >-
    Creates a real investor record from PII including tax ID and date of birth, and
    returns a non-expiring refresh token that must be stored encrypted. Requires a
    partnerReferenceId idempotency key.
- name: fundrise_update_client
  source_operation: openapi/fundrise-connect-openapi.yml#UpdateClient
  reason: Mutates an investor's identity and address of record.
- name: fundrise_place_investment
  source_operation: openapi/fundrise-connect-openapi.yml#PlaceInvestment
  reason: >-
    Moves real money into a private-market security. Requires prior presentation and
    digital acceptance of offering documents and acknowledgments by the end user.
    Human-in-the-loop should be required, not conditional.
- name: fundrise_cancel_investment
  source_operation: openapi/fundrise-connect-openapi.yml#CancelInvestment
  reason: Reverses a pending investment; only valid while isCancellable is true.
- name: fundrise_create_liquidation
  source_operation: openapi/fundrise-connect-openapi.yml#CreateShareLiquidationRequest
  reason: >-
    Sells shares back for dollars. Requires acknowledgment acceptance and a liquidable
    holding. Human-in-the-loop should be required.
- name: fundrise_cancel_liquidation
  source_operation: openapi/fundrise-connect-openapi.yml#CancelShareLiquidationRequest
  reason: Reverses a pending liquidation request.

excluded:
- operation: GetAccessToken
  reason: >-
    Credential exchange is transport plumbing, not a tool. A refresh token must never be
    exposed to a model; the server should hold it and mint access tokens internally.

