- status: 401
  title: Unauthorized
  schema: null
  media_type: null
  operation_count: 17
  descriptions:
  - Invalid or expired token
  remediation: >-
    For ClientBearerAuthentication operations, exchange the Client's stored refresh
    token at POST /v1/oauth/token (GetAccessToken) for a fresh access token and retry.
    For PartnerBasicAuthentication operations, verify the Partner credentials issued by
    Fundrise support. Declared on every operation in the spec; no response body schema
    is attached.
  source_operations: all

- status: 403
  title: Forbidden
  schema: FundriseConnectError
  media_type: application/json
  operation_count: 10
  descriptions:
  - Forbidden
  remediation: >-
    Distinct from 401 — the caller is authenticated but not permitted. Fundrise states
    that "there may be services or capabilities documented that are inaccessible with
    current permissions" and that additional endpoints are granted by contacting
    connect@fundrise.com. Also raised when a Client attempts to act on an account it
    does not own. Do not treat as retryable.
  source_operations:
  - openapi/fundrise-connect-openapi.yml#GetAccessToken
  - openapi/fundrise-connect-openapi.yml#CreateShareLiquidationRequest
  - openapi/fundrise-connect-openapi.yml#CancelShareLiquidationRequest
  - openapi/fundrise-connect-openapi.yml#GetHoldings
  - openapi/fundrise-connect-openapi.yml#CreateClient
  - openapi/fundrise-connect-openapi.yml#UpdateClient
  - openapi/fundrise-connect-openapi.yml#PlaceInvestment
  - openapi/fundrise-connect-openapi.yml#GetTaxForms
  - openapi/fundrise-connect-openapi.yml#GetTransaction
  - openapi/fundrise-connect-openapi.yml#GetTransactions

- status: 404
  title: Not Found
  schema: FundriseConnectError
  media_type: application/json
  operation_count: 9
  descriptions:
  - Not Found
  - Transaction not found or account does not own transaction
  remediation: >-
    Re-resolve the identifier. offeringId values come from GetOfferings, accountId from
    the accounts[] array returned by CreateClient or GetClient, and transactionId from
    GetTransactions. Note that Fundrise conflates "does not exist" with "not owned by
    this account" on GetTransaction, so a 404 there is not proof of non-existence.
  source_operations:
  - openapi/fundrise-connect-openapi.yml#CreateShareLiquidationRequest
  - openapi/fundrise-connect-openapi.yml#CancelShareLiquidationRequest
  - openapi/fundrise-connect-openapi.yml#GetHistoricalNav
  - openapi/fundrise-connect-openapi.yml#GetOfferingDocuments
