  - openapi/fundrise-connect-openapi.yml#GetInvestmentAcknowledgments
  - openapi/fundrise-connect-openapi.yml#PlaceInvestment
  - openapi/fundrise-connect-openapi.yml#CancelInvestment
  - openapi/fundrise-connect-openapi.yml#GetTransaction

- status: 409
  title: Conflict creating resource
  schema: FundriseConnectError
  media_type: application/json
  operation_count: 1
  descriptions:
  - Conflict creating resource
  remediation: >-
    The idempotency signal. Raised by CreateClient when the supplied partnerReferenceId
    has already been used, meaning the Client already exists on the Fundrise side. Treat
    as a successful no-op and resolve the existing Client rather than retrying with a new
    key.
  source_operations:
  - openapi/fundrise-connect-openapi.yml#CreateClient

- status: 500
  title: Internal Server Error
  schema: null
  media_type: null
  operation_count: 17
  descriptions: []
  remediation: >-
    Fundrise states 5xx responses "are rare" and indicate a fault on their servers.
    Retry with backoff; because PlaceInvestment and CreateClient carry a
    partnerReferenceId idempotency key, retrying those two after a 500 is safe. Report
    persistent failures to connect@fundrise.com with the Request-Id / referenceId.
  source_operations: all

