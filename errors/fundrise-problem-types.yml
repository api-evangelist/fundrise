notes: >-
  Derived from every 4xx/5xx response declared across the 17 operations of the Fundrise
  Connect OpenAPI 3.1.0, enriched with the Errors narrative from the spec's
  info.description. Fundrise does not use RFC 9457 application/problem+json — errors are
  returned as application/json bodies conforming to the FundriseConnectError schema.

envelope:
  schema: FundriseConnectError
  media_type: application/json
  required:
  - referenceId
  properties:
    referenceId:
      type: string
      max_length: 1000
      description: Unique reference ID generated for every request, for error tracing. Also returned in the Request-Id response header.
    code:
      type: string
      max_length: 6
      description: A numeric code mapping to a specific validation error. Present only on programmatically resolvable 4xx errors.
    message:
      type: string
      max_length: 1000
      description: A human readable description of the error.
    validationErrors:
      type: object
      schema: FieldErrorMap
      description: Map of field name to an array of form validation error messages.

policy:
  documented_statement: >-
    "Codes in the 2xx range indicate success. Codes in the 4xx range indicate an error
    that failed given the information provided (e.g., a required parameter was omitted,
    a charge failed, etc.). Codes in the 5xx range indicate an error with Fundrise's
    servers (these are rare). Some 4xx errors that could be handled programmatically
    (e.g., an address is invalid) include an error code that briefly explains the error
    reported. These errors that can be handled programmatically have error codes in the
    error response. Endpoints that have programmatically resolvable errors have those
    codes defined in their schema definitions."
  central_code_registry: false
  central_code_registry_note: >-
    Fundrise scopes the numeric `code` values to individual operation schema definitions
    rather than publishing one catalog, so no enumerated code list can be harvested from
    the public spec. An integrator must read code values per operation.

problems:
- status: 400
  title: Bad Request
  schema: FundriseConnectError
  media_type: application/json
  operation_count: 8
  descriptions:
  - Bad Request
  - Invalid operation type, Improperly formatted fields
  - Invalid operation type, Improperly formatted Client fields
  remediation: >-
    Inspect validationErrors for the per-field messages, and code where present.
    Common causes are malformed address or date-of-birth fields on Client creation and
    an investment amount outside the offering's minimumInvestmentAmount /
    maximumInvestmentAmount, which are enforced per Transaction.
  source_operations:
